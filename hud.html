<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>情绪 HUD 原型</title>
<style>
  :root { --ink: #fff; --dim: rgba(255,255,255,.62); --line: rgba(255,255,255,.22); --glass: rgba(118,118,128,.30); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden;
    font: 14px/1.45 -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #cv { width: 100%; height: 100%; object-fit: cover; display: block; }
  #stage.stereo .hud, #stage.stereo .panel, #stage.stereo #train { display: none !important; }

  /* 磨砂玻璃材质：半透明 + 背景模糊 + 细亮边 */
  .tag, .panel, .ctrl, #train, .card {
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(28px) saturate(1.7); backdrop-filter: blur(28px) saturate(1.7);
    box-shadow: 0 10px 36px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.18); }

  .hud { position: absolute; left: 0; right: 0; display: flex; justify-content: space-between; gap: 10px;
    padding: 14px 16px; pointer-events: none; }
  .top { top: env(safe-area-inset-top, 0); }
  .bottom { bottom: env(safe-area-inset-bottom, 0); flex-direction: column; align-items: center; gap: 10px; }
  .tag { display: inline-block; border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .rec { color: #ff453a; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .panel { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: min(250px, 48vw);
    border-radius: 28px; padding: 16px 18px; pointer-events: none; }
  .panel small { color: var(--dim); font-size: 12px; font-weight: 500; }
  .big { font-size: 34px; font-weight: 700; line-height: 1.15; margin: 2px 0 10px; letter-spacing: .01em; }
  .r { display: grid; grid-template-columns: 40px 1fr 36px; gap: 8px; align-items: center; margin: 7px 0; font-size: 13px; }
  .t { height: 6px; background: rgba(255,255,255,.16); border-radius: 99px; overflow: hidden; }
  .f { height: 100%; width: 0; background: #fff; border-radius: 99px; transition: width .25s ease; }
  .pct { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .tip { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); min-height: 1.5em; }

  .trend { display: flex; height: 5px; gap: 2px; width: min(520px, 92vw); }
  .trend span { flex: 1; background: rgba(255,255,255,.18); border-radius: 99px; }
  .ctrl { display: flex; gap: 2px; padding: 5px; border-radius: 28px; pointer-events: auto; flex-wrap: wrap; justify-content: center; max-width: 94vw; }
  button { font: inherit; font-weight: 500; color: var(--ink); background: transparent; border: 0; border-radius: 999px;
    padding: 9px 15px; cursor: pointer; transition: background .15s ease; }
  button:hover { background: rgba(255,255,255,.14); }
  button:active { background: rgba(255,255,255,.28); }

  #boot { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(120% 90% at 50% 0%, #3a3d46 0%, #17181c 55%, #0a0a0c 100%); }
  .card { border-radius: 34px; padding: 34px 30px 26px; max-width: 440px; }
  #boot h1 { font-size: 30px; font-weight: 700; margin: 0 0 10px; letter-spacing: .01em; }
  #boot p { color: var(--dim); margin: 6px auto; }
  #startBtn { font-size: 16px; font-weight: 600; padding: 12px 34px; margin: 18px 0 8px; background: #fff; color: #111; }
  #startBtn:hover { background: #f0f0f3; }
  #startBtn:disabled { opacity: .35; }
  a { color: #fff; text-underline-offset: 3px; }

  #train { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: min(290px, 78vw); display: none;
    border-radius: 28px; padding: 16px 18px; }
  #train h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  #train p { margin: 4px 0 10px; color: var(--dim); font-size: 12.5px; }
  .tr { display: grid; white-space: nowrap; grid-template-columns: 68px 1fr auto; gap: 8px; align-items: center; margin: 4px 0; }
  .tr small { color: var(--dim); }
  .tr button, .trfoot button { padding: 5px 13px; background: rgba(255,255,255,.14); }
  .tr button:hover, .trfoot button:hover { background: rgba(255,255,255,.26); }
  .trfoot { display: flex; gap: 8px; margin-top: 12px; }
  #recMsg { min-height: 1.5em; color: #ffd60a; margin-top: 8px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <video id="video" playsinline muted style="display:none"></video>

  <div class="hud top">
    <div><span class="tag">情绪 HUD</span> <span class="tag" id="clock">--:--:--</span></div>
    <div><span class="tag"><span class="rec">●</span> <span id="fps">0.0</span> FPS</span> <span class="tag">目标 <span id="count">0</span></span> <span class="tag" id="pTag">个性化 关</span></div>
  </div>

  <div class="panel" id="panel">
    <small>主目标</small>
    <div class="big" id="mood">搜索中</div>
    <div id="bars"></div>
    <div class="tip" id="overall">整体心情：观察中…</div>
    <div class="tip" id="tip" style="border-top:0;padding-top:0;margin-top:2px">视野内没有人脸</div>
  </div>

  <div class="hud bottom">
    <div class="trend" id="trend"></div>
    <div class="ctrl">
      <button id="trainBtn">教它认识我</button>
      <button id="styleBtn">标记：气泡</button>
      <button id="objBtn">物体识别：开</button>
      <button id="stereoBtn">双眼模式</button>
      <button id="modeBtn">镜片模式：关</button>
      <button id="flipBtn">翻转摄像头</button>
      <button id="stopBtn">停止</button>
    </div>
  </div>

  <div id="train">
    <h3>教它认识我</h3>
    <p>选一种情绪，做出你自己平时的那种表情，点「录制」并保持 3 秒。至少录两种（建议先录「平静」），录得越全越准。只对画面中最大的那张脸生效。</p>
    <div id="trainRows"></div>
    <div id="recMsg"></div>
    <div class="trfoot"><button id="trainClear">清除全部</button><button id="trainDone">完成</button></div>
  </div>

  <div id="boot">
    <div class="card">
      <h1>情绪 HUD</h1>
      <p>智能眼镜情绪 HUD 的手机原型：把摄像头当作眼镜的摄像头，屏幕当作镜片显示。</p>
      <p>所有识别都在本机完成，画面不会上传。点物体标签会打开网页搜索，只发送物体名称。请只对同意被识别的人使用。</p>
      <button id="startBtn" disabled>启动 HUD</button>
      <p id="status">正在加载模型…</p>
      <p><a href="index.html">← 返回普通版</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
const HS_URL = 'https://raw.githubusercontent.com/av-savchenko/face-emotion-recognition/main/models/affectnet_emotions/onnx/enet_b0_8_best_vgaf.onnx';
const EMO = {
  happy:     { zh: '开心', color: '#ffd60a', tip: '对方心情不错，气氛很好' },
  neutral:   { zh: '平静', color: '#f2f2f7', tip: '对方状态平稳' },
  sad:       { zh: '难过', color: '#64d2ff', tip: '对方有些低落，语气放缓一点' },
  angry:     { zh: '生气', color: '#ff453a', tip: '对方不太高兴，先别争辩' },
  surprised: { zh: '惊讶', color: '#bf5af2', tip: '对方感到意外' },
  fearful:   { zh: '害怕', color: '#7d7aff', tip: '对方显得紧张不安' },
  disgusted: { zh: '厌恶', color: '#c4a47c', tip: '对方对此比较反感' },
  contempt:  { zh: '轻蔑', color: '#ff9f0a', tip: '对方似乎不以为然' },
};
const KEYS = Object.keys(EMO);
const EMOJI = { happy: '😄', neutral: '😐', sad: '😢', angry: '😠', surprised: '😲', fearful: '😨', disgusted: '🤢', contempt: '😒' };
const UNSURE = 0.45;   // 最高的一项都不到这个概率，就老实说“不确定”
// 情绪的正负倾向，用来把一段时间内的表情汇总成“整体心情”
const VALENCE = { happy: 1, surprised: 0.2, neutral: 0, contempt: -0.6, sad: -0.8, fearful: -0.8, disgusted: -0.9, angry: -1 };
const STYLES = [['pill', '气泡'], ['dot', '圆点'], ['ring', '光环'], ['corner', '角标']];
let styleIdx = 0;
try { styleIdx = Math.max(0, STYLES.findIndex(s => s[0] === localStorage.getItem('hudStyle'))); } catch (e) {}
const HS8 = ['angry', 'contempt', 'disgusted', 'fearful', 'happy', 'neutral', 'sad', 'surprised'];
const HS7 = ['angry', 'disgusted', 'fearful', 'happy', 'neutral', 'sad', 'surprised'];
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), video = $('video');
const cropC = document.createElement('canvas'); cropC.width = cropC.height = 224;
const cctx = cropC.getContext('2d', { willReadFrequently: true });
const flipC = document.createElement('canvas'), fctx = flipC.getContext('2d');

let emoSession = null, stream = null, running = false, busy = false, hudOnly = false, facing = 'environment';
let faces = [], smooth = null, shownTop = null, candTop = null, candN = 0, frameNo = 0, fps = 0, lastDet = 0, lastHist = 0;
const history = [];
const topOf = e => KEYS.reduce((a, k) => (e[k] || 0) > (e[a] || 0) ? k : a, KEYS[0]);

$('bars').innerHTML = [0, 1, 2].map(i =>
  `<div class="r"><span id="n${i}">--</span><div class="t"><div class="f" id="f${i}"></div></div><span class="pct" id="p${i}">0%</span></div>`).join('');
$('trend').innerHTML = '<span></span>'.repeat(40);

async function hsPredict(src, box) {
  const sw = src.videoWidth || src.width, sh = src.videoHeight || src.height;
  const x = Math.max(0, box.x), y = Math.max(0, box.y);
  const w = Math.min(sw - x, box.width), h = Math.min(sh - y, box.height);
  if (w < 8 || h < 8) return null;
  cctx.drawImage(src, x, y, w, h, 0, 0, 224, 224);
  const d = cctx.getImageData(0, 0, 224, 224).data, N = 224 * 224, t = new Float32Array(3 * N);
  for (let i = 0; i < N; i++) {
    t[i]         = (d[i * 4]     / 255 - 0.485) / 0.229;
    t[i + N]     = (d[i * 4 + 1] / 255 - 0.456) / 0.224;
    t[i + 2 * N] = (d[i * 4 + 2] / 255 - 0.406) / 0.225;
  }
  const out = await emoSession.run({ [emoSession.inputNames[0]]: new ort.Tensor('float32', t, [1, 3, 224, 224]) });
  const logits = Array.from(out[emoSession.outputNames[0]].data), labels = logits.length === 8 ? HS8 : HS7;
  const m = Math.max(...logits), ex = logits.map(v => Math.exp(v - m)), sum = ex.reduce((a, v) => a + v, 0);
  const res = {}; for (const k of KEYS) res[k] = 0;
  labels.forEach((k, i) => res[k] = ex[i] / sum);
  return res;
}

// 返回 [{box:{x,y,width,height}, expressions}]，坐标已换算回未翻转的画面
async function analyze(src, flip) {
  const W = src.videoWidth || src.width, H = src.videoHeight || src.height;
  let input = src;
  if (flip) {
    flipC.width = W; flipC.height = H;
    fctx.save(); fctx.translate(W, 0); fctx.scale(-1, 1); fctx.drawImage(src, 0, 0, W, H); fctx.restore();
    input = flipC;
  }
  const opts = new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 });
  let raw;
  if (emoSession) {
    const dets = (await faceapi.detectAllFaces(input, opts)).sort((a, b) => b.box.area - a.box.area).slice(0, 4);
    raw = [];
    for (const det of dets) {
      const expressions = await hsPredict(input, det.box);
      if (expressions) raw.push({ box: det.box, expressions });
    }
  } else {
    raw = (await faceapi.detectAllFaces(input, opts).withFaceLandmarks().withFaceExpressions())
      .map(f => ({ box: f.detection.box, expressions: f.expressions }));
  }
  return raw.map(f => ({
    box: { x: flip ? W - f.box.x - f.box.width : f.box.x, y: f.box.y, width: f.box.width, height: f.box.height },
    expressions: f.expressions,
  })).sort((a, b) => b.box.width * b.box.height - a.box.width * a.box.height);
}

function updatePanel(expr, top, overall) {
  $('count').textContent = faces.length;
  if (!expr) {
    $('mood').textContent = '搜索中'; $('mood').style.color = '';
    $('tip').textContent = '视野内没有人脸'; $('overall').textContent = '整体心情：观察中…';
    for (let i = 0; i < 3; i++) { $('n' + i).textContent = '--'; $('f' + i).style.width = '0'; $('p' + i).textContent = '0%'; }
    return;
  }
  const unsure = expr[top] < UNSURE;
  $('mood').textContent = unsure ? '不确定' : EMO[top].zh; $('mood').style.color = unsure ? '#aeaeb2' : EMO[top].color;
  $('tip').textContent = unsure ? '表情不明显，暂时判断不了' : EMO[top].tip;
  $('overall').textContent = '整体心情：' + (overall || '观察中…');
  KEYS.slice().sort((a, b) => expr[b] - expr[a]).slice(0, 3).forEach((k, i) => {
    $('n' + i).textContent = EMO[k].zh;
    $('f' + i).style.width = (expr[k] * 100).toFixed(0) + '%'; $('f' + i).style.background = EMO[k].color;
    $('p' + i).textContent = Math.round(expr[k] * 100) + '%';
  });
}

function pushTrend(top) {
  history.push(top); if (history.length > 40) history.shift();
  const cells = $('trend').children, off = 40 - history.length;
  history.forEach((k, i) => cells[off + i].style.background = EMO[k].color);
}

// ---- 个性化：用你自己录的表情样本，修正模型对“你这张脸”的判断 ----
let personal = {}, pModel = null, rec = null;
try { personal = JSON.parse(localStorage.getItem('hudPersonal') || '{}'); } catch (e) {}
const feat = p => KEYS.map(k => Math.sqrt(p[k] || 0));
const dist2 = (a, b) => a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0);
function buildModel() {
  const labels = KEYS.filter(k => (personal[k] || []).length >= 5);
  pModel = null;
  if (labels.length >= 2) {
    const cents = {}; let msd = 0, n = 0;
    for (const l of labels) {
      const vecs = personal[l].map(v => v.map(Math.sqrt));
      const c = KEYS.map((_, i) => vecs.reduce((s, v) => s + v[i], 0) / vecs.length);
      cents[l] = c; for (const v of vecs) { msd += dist2(v, c); n++; }
    }
    pModel = { labels, cents, T: Math.max(0.03, msd / n) };   // T：你同一种表情自身的波动幅度
  }
  $('pTag').textContent = pModel ? `个性化 开(${labels.length})` : '个性化 关';
}
// 看当前表情离你录过的哪一种最近，再和模型原始判断按 7:3 融合
function personalize(p) {
  if (!pModel) return p;
  const x = feat(p), ds = pModel.labels.map(l => dist2(x, pModel.cents[l])), m = Math.min(...ds);
  const w = ds.map(d => Math.exp(-(d - m) / pModel.T)), sum = w.reduce((a, v) => a + v, 0);
  const out = {}; for (const k of KEYS) out[k] = 0.3 * (p[k] || 0);
  pModel.labels.forEach((l, i) => out[l] += 0.7 * w[i] / sum);
  return out;
}
function renderTrain() {
  $('trainRows').innerHTML = KEYS.map(k =>
    `<div class="tr"><span>${EMOJI[k]} ${EMO[k].zh}</span><small>${(personal[k] || []).length ? '已录 ' + personal[k].length + ' 帧' : '未录'}</small>
     <button data-k="${k}">录制</button></div>`).join('');
}
function savePersonal() {
  try { localStorage.setItem('hudPersonal', JSON.stringify(personal)); } catch (e) {}
  buildModel(); renderTrain();
}
function recordSample(result, ts) {
  if (!rec) return;
  if (result[0]) rec.samples.push(KEYS.map(k => +(result[0].expressions[k] || 0).toFixed(3)));
  const left = Math.ceil((rec.until - ts) / 1000);
  if (left > 0) { $('recMsg').textContent = `正在录制「${EMO[rec.label].zh}」，保持表情… ${left}`; return; }
  if (rec.samples.length >= 5) {
    personal[rec.label] = (personal[rec.label] || []).concat(rec.samples).slice(-60);
    $('recMsg').textContent = `「${EMO[rec.label].zh}」已录好 ${rec.samples.length} 帧`;
  } else $('recMsg').textContent = '没拍到足够的人脸，请正对镜头再录一次';
  rec = null; savePersonal();
}

// 人脸跟踪：把每次检测结果对应到同一个人身上，位置和情绪都做平滑，标记才不会乱跳
let tracks = [], mainId = null, nextId = 1;
const mid = b => [b.x + b.width / 2, b.y + b.height / 2];
const area = t => t.target.width * t.target.height;
function onFaces(result, ts) {
  recordSample(result, ts);
  const used = new Set();
  for (const f of result) {
    const [fx, fy] = mid(f.box);
    let best = null, bd = Infinity;
    for (const t of tracks) {
      if (used.has(t)) continue;
      const [tx, ty] = mid(t.target), d = Math.hypot(fx - tx, fy - ty);
      if (d < Math.max(t.target.width, f.box.width) * 0.7 && d < bd) { best = t; bd = d; }
    }
    if (best) {
      used.add(best); best.miss = 0;
      // 死区：检测框只有轻微变化时不动，过滤掉检测器自身的噪声
      const tw = best.target.width;
      if (bd > tw * 0.06 || Math.abs(f.box.width - tw) > tw * 0.12) best.target = f.box;
      const ex = best.id === mainId ? personalize(f.expressions) : f.expressions;   // 个性化只用于主目标
      for (const k of KEYS) best.expr[k] = best.expr[k] * 0.75 + ex[k] * 0.25;
      const t = topOf(best.expr);
      if (t === best.top) best.candN = 0;
      else {
        best.candN = t === best.cand ? best.candN + 1 : 1; best.cand = t;
        if (best.candN >= 4 || best.expr[t] - best.expr[best.top] > 0.25) { best.top = t; best.candN = 0; }
      }
    } else {
      const t = { id: nextId++, box: { ...f.box }, target: f.box, expr: { ...f.expressions },
                  top: topOf(f.expressions), cand: null, candN: 0, miss: 0, shownPct: null };
      tracks.push(t); used.add(t);
    }
  }
  // 偶尔漏检几帧时保留标记，避免闪烁
  tracks = tracks.filter(t => used.has(t) || ++t.miss <= 5);
  let main = tracks.find(t => t.id === mainId);
  const big = tracks.reduce((a, t) => !a || area(t) > area(a) ? t : a, null);
  if (!main || (big && area(big) > area(main) * 1.4)) main = big;   // 主目标不轻易换人
  mainId = main ? main.id : null;
  faces = main ? [main, ...tracks.filter(t => t !== main)] : [];
  let overall = null;
  if (main) {   // 整体心情 = 主目标最近 30 秒表情倾向的平均，而不是某一瞬间的表情
    let v = 0; for (const k of KEYS) v += main.expr[k] * VALENCE[k];
    main.val = (main.val || []).filter(p => ts - p.ts < 30000); main.val.push({ ts, v });
    if (ts - main.val[0].ts > 5000) {
      const avg = main.val.reduce((a, p) => a + p.v, 0) / main.val.length;
      overall = avg > 0.25 ? '偏积极' : avg < -0.25 ? '偏消极' : '平稳';
    }
  }
  updatePanel(main && main.expr, main && main.top, overall);
  if (main && ts - lastHist > 1000) { pushTrend(main.top); lastHist = ts; }
}

// ---- 物体识别：Google MediaPipe 的 EfficientDet-Lite0 模型，可识别 80 类常见物体 ----
const MP_VER = '0.10.14', MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const OBJ_ZH = { bicycle: '自行车', car: '汽车', motorcycle: '摩托车', airplane: '飞机', bus: '公交车', train: '火车', truck: '卡车', boat: '船',
  'traffic light': '红绿灯', 'fire hydrant': '消防栓', 'stop sign': '停车标志', 'parking meter': '停车计时器', bench: '长椅', bird: '鸟', cat: '猫', dog: '狗',
  horse: '马', sheep: '羊', cow: '牛', elephant: '大象', bear: '熊', zebra: '斑马', giraffe: '长颈鹿', backpack: '背包', umbrella: '雨伞', handbag: '手提包',

let objDetector = null, objOn = true, objs = [], objHits = [], lastObjTs = 0, lastObjRun = 0;
async function loadObjectDetector() {
  const mp = await import(`${MP_BASE}/vision_bundle.mjs`);
  const fileset = await mp.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  const make = delegate => mp.ObjectDetector.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: 'models/efficientdet_lite0.tflite', delegate }, runningMode: 'VIDEO', scoreThreshold: 0.4, maxResults: 8 });
  try { objDetector = await make('GPU'); } catch (e) { objDetector = await make('CPU'); }
}
function detectObjects(src) {
  if (!objDetector || !objOn) { objs = []; return; }
  const ts = Math.max(lastObjTs + 1, Math.round(performance.now())); lastObjTs = ts;
  const found = objDetector.detectForVideo(src, ts).detections
    .map(d => ({ name: d.categories[0].categoryName, score: d.categories[0].score,
                 box: { x: d.boundingBox.originX, y: d.boundingBox.originY, width: d.boundingBox.width, height: d.boundingBox.height } }))
    .filter(d => d.name !== 'person' && OBJ_ZH[d.name]);        // 人交给人脸识别处理
  const used = new Set();
  for (const d of found) {                                       // 和上一次的结果对上号，位置才能平滑移动
    const c = [d.box.x + d.box.width / 2, d.box.y + d.box.height / 2];
    const o = objs.find(o => !used.has(o) && o.name === d.name &&
      Math.hypot(c[0] - o.target.x - o.target.width / 2, c[1] - o.target.y - o.target.height / 2) < Math.max(o.target.width, d.box.width) * 0.6);
    if (o) { used.add(o); o.target = d.box; o.score = o.score * 0.6 + d.score * 0.4; o.miss = 0; }
    else { const n = { name: d.name, score: d.score, box: { ...d.box }, target: d.box, miss: 0 }; objs.push(n); used.add(n); }
  }
  objs = objs.filter(o => used.has(o) || ++o.miss <= 3);
}
// 物体标记：四角细线 + 小号磨砂标签。点标签会打开网页搜索
function drawObjects(W, H, u, map, hits) {
  const fs = Math.max(12, u * 1.35);
  for (const o of objs) {
    const b = map(o), zh = OBJ_ZH[o.name];
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = Math.max(1.5, u * .14); ctx.lineCap = 'round';
    const L = Math.min(b.width, b.height) * .16;
    ctx.beginPath();
    for (const [x, y, dx, dy] of [[b.x, b.y, 1, 1], [b.x + b.width, b.y, -1, 1], [b.x, b.y + b.height, 1, -1], [b.x + b.width, b.y + b.height, -1, -1]]) {
      ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L);
    }
    ctx.stroke();
    const text = `${zh} ⌕`;
    ctx.font = `500 ${fs}px -apple-system, "PingFang SC", sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const pw = ctx.measureText(text).width + fs * 1.3, ph = fs * 1.9;
    const px = Math.max(visX0 + 6, Math.min(b.x + b.width / 2 - pw / 2, visX1 - pw - 6)), py = Math.max(4, Math.min(b.y + fs * .5, H - ph - 4));
    ctx.save();

    if (bgDraw) { ctx.filter = 'blur(12px) saturate(1.6)'; bgDraw(); ctx.filter = 'none'; }
    ctx.fillStyle = bgDraw ? 'rgba(118,118,128,.36)' : 'rgba(70,70,76,.92)'; ctx.fillRect(px, py, pw, ph);
    ctx.restore();
    ctx.lineWidth = Math.max(1, u * .08); ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath(); ctx.roundRect(px, py, pw, ph, ph / 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText(text, px + fs * .65, py + ph / 2 + 1);
    if (hits) hits.push({ x: px, y: py, w: pw, h: ph, q: zh });

}

let stereo = false, stereoSince = 0, srcW = 1280, bgDraw = null, visX0 = 0, visX1 = 1280;
const FACE_W = 0.16, CAM_F = 0.785;   // 人脸平均宽度(米)；焦距与画面宽度之比(按约 65° 视野的摄像头估)

function render(src) {
  if (src) srcW = src.videoWidth || src.width || srcW;
  for (const f of faces) {
    for (const k of ['x', 'y', 'width', 'height']) f.box[k] += (f.target[k] - f.box[k]) * 0.15;  // 每帧缓动到目标位置
    // 百分比只在变化超过 4 个点时才刷新，数字不再狂跳
    const rawPct = Math.round(f.expr[f.top] * 100);
    if (f.shownPct == null || Math.abs(rawPct - f.shownPct) >= 4) f.shownPct = rawPct;
    // 按人脸在画面里的大小估算距离，变化超过 0.2 米才刷新
    const d = FACE_W * CAM_F * srcW / Math.max(8, f.box.width);
    if (f.dist == null || Math.abs(d - f.dist) >= 0.2) f.dist = Math.round(d * 10) / 10;
  }
  for (const o of objs) for (const k of ['x', 'y', 'width', 'height']) o.box[k] += (o.target[k] - o.box[k]) * 0.2;
  objHits = [];
  const W = cv.width, H = cv.height;
  if (!stereo) {
    const drawSrc = () => { if (mirror) { ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(src, 0, 0, W, H); ctx.restore(); } else ctx.drawImage(src, 0, 0, W, H); };
    if (hudOnly || !src) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
    else drawSrc();
    bgDraw = hudOnly || !src ? null : drawSrc;
    const mapN = f => mirror ? { x: W - f.box.x - f.box.width, y: f.box.y, width: f.box.width, height: f.box.height } : f.box;
    // 画布按“铺满”方式显示，两侧可能被裁掉；算出实际可见的横向范围，标签不要跑到屏幕外
    const k = Math.max(cv.clientWidth / W, cv.clientHeight / H) || 1, vis = Math.min(W, cv.clientWidth / k || W);
    visX0 = (W - vis) / 2; visX1 = visX0 + vis;
    drawObjects(W, H, Math.max(W, H) / 100, mapN, objHits);
    drawMarkers(W, H, Math.max(W, H) / 100, mapN);
    return;
  }
  // 双眼模式：左右各画一遍。标记在两眼里略微错开，看起来浮在画面前方
  const w = W / 2, vw = src ? (src.videoWidth || src.width) : srcW, vh = src ? (src.videoHeight || src.height) : srcW * 9 / 16;
  const sc = Math.max(w / vw, H / vh), ox = (w - vw * sc) / 2, oy = (H - vh * sc) / 2;

    ctx.save();
    ctx.beginPath(); ctx.rect(eye * w, 0, w, H); ctx.clip();
    ctx.translate(eye * w, 0);
    if (hudOnly || !src) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, H); }
    else ctx.drawImage(src, ox, oy, vw * sc, vh * sc);
    const pop = (eye === 0 ? 1 : -1) * w * 0.004, u = Math.max(w, H) / 100 * 1.25;
    bgDraw = hudOnly || !src ? null : () => ctx.drawImage(src, ox, oy, vw * sc, vh * sc);
    visX0 = 0; visX1 = w;
    const mapBox = f => ({ x: ox + f.box.x * sc + pop, y: oy + f.box.y * sc, width: f.box.width * sc, height: f.box.height * sc });
    drawObjects(w, H, u, mapBox, null);
    drawMarkers(w, H, u, mapBox);
    drawEyeInfo(w, H, u, pop * 2.5);

}

// 双眼模式下画在每只眼睛画面里的状态信息（放在中间区域，避开镜片边缘）
function drawEyeInfo(w, H, u, pop) {
  const main = faces[0];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 6;
  ctx.font = `500 ${u * 1.5}px -apple-system, "PingFang SC", sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillText(`目标 ${faces.length} · ${fps.toFixed(1)} FPS`, w / 2 + pop, H * 0.2);
  if (main) {
    const unsure = main.expr[main.top] < UNSURE;
    ctx.font = `600 ${u * 1.9}px "PingFang SC", sans-serif`;
    ctx.fillStyle = unsure ? '#aeaeb2' : EMO[main.top].color;
    ctx.fillText((unsure ? '不确定' : EMO[main.top].zh) + ' · ' + $('overall').textContent, w / 2 + pop, H * 0.8);
  }
  if (performance.now() - stereoSince < 4000) {
    ctx.font = `500 ${u * 1.5}px "PingFang SC", sans-serif`; ctx.fillStyle = '#fff';
    ctx.fillText('点一下屏幕退出双眼模式', w / 2 + pop, H * 0.5);
  }
  ctx.shadowBlur = 0;
}

function drawMarkers(W, H, u, map) {
  // 人脸标记：四种样式可切换
  const style = STYLES[styleIdx][0], fs = Math.max(14, u * 1.7);
  faces.forEach((f, i) => {
    const b = map(f), e = f.expr, top = f.top, unsure = e[top] < UNSURE, col = unsure ? '#aeaeb2' : EMO[top].color;
    const cx = b.x + b.width / 2, pct = f.shownPct, main = i === 0;
    const far = f.dist && f.dist < 10 ? ` · ${f.dist.toFixed(1)}米` : '';
    const label = (unsure ? '不确定' : `${EMO[top].zh} ${pct}%`) + far, emo = unsure ? '❔' : EMOJI[top];
    ctx.font = `600 ${fs}px -apple-system, "PingFang SC", sans-serif`;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';

      const text = `${emo} ${label}`;
      ctx.font = `600 ${fs}px -apple-system, "PingFang SC", sans-serif`;
      const pw = ctx.measureText(text).width + fs * 1.5, ph = fs * 2.05, gap = fs * .75;

      ctx.save();
      ctx.beginPath(); ctx.roundRect(px, py, pw, ph, ph / 2); ctx.clip();
      if (bgDraw) { ctx.filter = 'blur(14px) saturate(1.6)'; bgDraw(); ctx.filter = 'none'; }   // 把背后的画面模糊，形成磨砂效果
      ctx.fillStyle = bgDraw ? 'rgba(118,118,128,.34)' : 'rgba(70,70,76,.92)'; ctx.fillRect(px, py, pw, ph);
      ctx.restore();

      ctx.beginPath(); ctx.roundRect(px, py, pw, ph, ph / 2); ctx.stroke();

        ctx.fillStyle = col; ctx.beginPath();

      }

    } else if (style === 'dot') {      // 最简：一个小圆点 + 文字

      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, dy, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 6;
      ctx.fillStyle = '#fff'; ctx.fillText(`${label}`, cx + r + fs * .4, dy + 1);
      ctx.shadowBlur = 0;
    } else if (style === 'ring') {     // 柔和的椭圆光环

      ctx.beginPath(); ctx.ellipse(cx, b.y + b.height / 2, b.width * .62, b.height * .68, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 6;
      ctx.textAlign = 'center'; ctx.fillStyle = col;
      ctx.fillText(`${emo} ${label}`, cx, Math.min(H - fs, b.y + b.height * 1.18 + fs));
      ctx.shadowBlur = 0;
    } else {                           // 原来的科幻角标
      const L = Math.min(b.width, b.height) * .22;
      ctx.shadowColor = col; ctx.shadowBlur = u * .8;
      ctx.beginPath();
      for (const [x, y, dx, dy] of [[b.x, b.y, 1, 1], [b.x + b.width, b.y, -1, 1], [b.x, b.y + b.height, 1, -1], [b.x + b.width, b.y + b.height, -1, -1]]) {

}

function loop(ts) {
  if (!running) return;
  render(video);
  if (!busy) {
    busy = true;
    analyze(video, (++frameNo % 2) === 1).then(r => {
      const now = performance.now();
      if (lastDet) fps = fps * 0.8 + (1000 / (now - lastDet)) * 0.2;
      lastDet = now; $('fps').textContent = fps.toFixed(1);
      onFaces(r, now);
      if (now - lastObjRun > 300) { lastObjRun = now; try { detectObjects(video); } catch (e) { console.warn(e); } }
    }).catch(err => console.warn(err)).finally(() => busy = false);
  }
  requestAnimationFrame(loop);
}

      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 6000);
      let resp = await fetch(HS_URL, { signal: ac.signal }).catch(() => null);
      clearTimeout(timer);
      if (!resp || !resp.ok) resp = await fetch('models/enet_b0_8_best_vgaf.onnx');
      const buf = await resp.arrayBuffer();
      const sess = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'] });
      emoSession = sess;
      await hsPredict(warm, { x: 0, y: 0, width: 160, height: 160 });
    } catch (err) { emoSession = null; note = '（增强模型加载失败，使用基础模型）'; console.warn(err); }
    window.__ready = true;
    loadObjectDetector().then(() => { window.__objReady = true; })
      .catch(err => { console.warn('object detector failed', err); $('objBtn').textContent = '物体识别：不可用'; objOn = false; });
    $('startBtn').disabled = false;
    $('status').textContent = '模型已就绪' + note;
  } catch (err) {
    $('status').textContent = '模型加载失败，请检查网络后刷新：' + err.message;
  }
})();
</script>
</body>
</html>
