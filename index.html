<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表情心情识别</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1b18; --muted: #6f6a61;
    --line: #e4dfd5; --accent: #d9622b; --track: #eee9df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --card: #211f1c; --ink: #f1ede4; --muted: #a39c8f;
            --line: #35322d; --accent: #f08a4b; --track: #2d2a26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .stage { position: relative; aspect-ratio: 4 / 3; background: #0d0c0b; border-radius: 10px;
    overflow: hidden; display: grid; place-items: center; }
  canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .hint { position: absolute; color: #cfc8ba; text-align: center; padding: 0 24px; font-size: 15px; }
  .bar-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button, .filebtn { font: inherit; border-radius: 10px; padding: 9px 16px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }
  .status { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 20px; }
  .mood { display: flex; align-items: center; gap: 14px; padding-bottom: 14px;
    border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .emoji { font-size: 56px; line-height: 1; }
  .mood-name { font-size: 26px; font-weight: 700; }
  .mood-desc { color: var(--muted); font-size: 14px; }
  .row { display: grid; grid-template-columns: 64px 1fr 44px; align-items: center; gap: 8px; margin: 9px 0; font-size: 14px; }
  .track { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 99px; transition: width .18s linear; }
  .pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 18px 0 8px; }
  .timeline { display: flex; height: 26px; border-radius: 6px; overflow: hidden; background: var(--track); }
  .timeline span { flex: 1; }
  .note { color: var(--muted); font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>表情心情识别</h1>
  <p class="sub">用摄像头或照片识别面部表情，实时估计八种情绪。所有计算都在你的浏览器本地完成，画面不会上传。 <a href="hud.html" style="color:var(--accent)">试试眼镜 HUD 原型 →</a></p>

  <div class="grid">
    <section class="card">
      <div class="stage">
        <canvas id="canvas" width="640" height="480"></canvas>
        <div class="hint" id="hint">点击「开启摄像头」，或上传一张人脸照片</div>
      </div>
      <div class="bar-row">
        <button class="primary" id="camBtn" disabled>开启摄像头</button>
        <label class="filebtn" id="fileLbl">上传照片<input type="file" id="file" accept="image/*"></label>
        <button id="calBtn" disabled title="保持面无表情 3 秒，让程序记住你平时的脸，之后的结果会更准">个人校准</button>
      </div>
      <div class="status" id="status">正在加载识别模型…</div>
      <video id="video" playsinline muted style="display:none"></video>
    </section>

    <section class="card">
      <div class="mood">
        <div class="emoji" id="emoji">🙂</div>
        <div>
          <div class="mood-name" id="moodName">等待识别</div>
          <div class="mood-desc" id="moodDesc">还没有检测到人脸</div>
        </div>
      </div>
      <div id="bars"></div>
      <h2>最近的心情变化</h2>
      <div class="timeline" id="timeline"></div>
    </section>
  </div>

  <p class="note">说明：模型识别的是「面部表情」，不等于真实的内心感受——人可以面无表情地开心，也可以礼貌地微笑。结果仅供参考和娱乐。</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
const EMO = {
  happy:     { zh: '开心', emoji: '😄', color: '#f2b01e', desc: '看起来心情不错' },
  neutral:   { zh: '平静', emoji: '😐', color: '#8f9aa3', desc: '表情比较放松、平和' },
  sad:       { zh: '难过', emoji: '😢', color: '#4f86c6', desc: '看起来有点低落' },
  angry:     { zh: '生气', emoji: '😠', color: '#d64541', desc: '眉头紧了，似乎不太高兴' },
  surprised: { zh: '惊讶', emoji: '😲', color: '#9b59b6', desc: '好像被什么吓了一跳' },
  fearful:   { zh: '害怕', emoji: '😨', color: '#3aa58a', desc: '看起来有些紧张不安' },
  disgusted: { zh: '厌恶', emoji: '🤢', color: '#7a9a2e', desc: '似乎对什么很嫌弃' },
  contempt:  { zh: '轻蔑', emoji: '😒', color: '#b07a4a', desc: '带点不屑或不以为然' },
};
const KEYS = Object.keys(EMO);
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d'), video = $('video');
let stream = null, running = false, busy = false, lastFaces = [], lastFlip = false, smooth = null, lastTick = 0;
let baseline = null, calib = null, shownTop = null, candTop = null, candN = 0, frameNo = 0;
const flipC = document.createElement('canvas'), fctx = flipC.getContext('2d');

// 个人校准：减去“面无表情”时模型对这张脸的固有偏差，多出来的概率归还给“平静”
function adjust(e) {
  if (!baseline) return e;
  const out = {}; let moved = 0;
  for (const k of KEYS) {
    if (k === 'neutral') continue;
    const v = Math.max(0, e[k] - baseline[k]);
    moved += e[k] - v; out[k] = v;
  }
  out.neutral = e.neutral + moved;
  return out;
}
const topOf = e => KEYS.reduce((a, k) => e[k] > e[a] ? k : a, KEYS[0]);
function drawFlipped(src, w, h) {
  flipC.width = w; flipC.height = h;
  fctx.save(); fctx.translate(w, 0); fctx.scale(-1, 1); fctx.drawImage(src, 0, 0, w, h); fctx.restore();
  return flipC;
}
const history = [];

// build bars
$('bars').innerHTML = KEYS.map(k =>
  `<div class="row"><span>${EMO[k].emoji} ${EMO[k].zh}</span>
   <div class="track"><div class="fill" id="f-${k}" style="background:${EMO[k].color}"></div></div>
   <span class="pct" id="p-${k}">0%</span></div>`).join('');

function setStatus(t) { $('status').textContent = t; }

function showResult(expr, forcedTop) {
  if (!expr) {
    $('emoji').textContent = '🫥';
    $('moodName').textContent = '未检测到人脸';
    $('moodDesc').textContent = '请正对镜头，保证光线充足';
    return;
  }
  let top = KEYS[0];
  for (const k of KEYS) {
    const v = expr[k] || 0;
    $('f-' + k).style.width = (v * 100).toFixed(1) + '%';
    $('p-' + k).textContent = Math.round(v * 100) + '%';
    if (v > (expr[top] || 0)) top = k;
  }
  if (forcedTop) top = forcedTop;
  $('emoji').textContent = EMO[top].emoji;
  $('moodName').textContent = EMO[top].zh;
  $('moodDesc').textContent = EMO[top].desc + `（置信度 ${Math.round(expr[top] * 100)}%）`;
  return top;
}

function pushHistory(top) {
  history.push(top); if (history.length > 60) history.shift();
  $('timeline').innerHTML = history.map(k =>
    `<span title="${EMO[k].zh}" style="background:${EMO[k].color}"></span>`).join('');
}

function drawFaces(faces, mirrorW) {
  ctx.lineWidth = Math.max(2, canvas.width / 320);
  ctx.font = `600 ${Math.max(14, canvas.width / 40)}px -apple-system, "PingFang SC", sans-serif`;
  for (const f of faces) {
    const b = f.detection.box;
    const x = mirrorW ? mirrorW - b.x - b.width : b.x;
    const ex = adjust(f.expressions), top = topOf(ex);
    const e = EMO[top];
    ctx.strokeStyle = e.color;
    ctx.strokeRect(x, b.y, b.width, b.height);
    const label = `${e.emoji} ${e.zh} ${Math.round(ex[top] * 100)}%`;
    const w = ctx.measureText(label).width + 12, h = parseInt(ctx.font.match(/(\d+)px/)[1]) + 10;
    ctx.fillStyle = e.color;
    ctx.fillRect(x, Math.max(0, b.y - h), w, h);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x + 6, Math.max(h, b.y) - 7);
  }
}

// 增强表情模型：HSEmotion (EfficientNet-B0，AffectNet 数据集训练)，用 ONNX Runtime 在浏览器里跑
const HS_URL = 'https://raw.githubusercontent.com/av-savchenko/face-emotion-recognition/main/models/affectnet_emotions/onnx/enet_b0_8_best_vgaf.onnx';
const HS8 = ['angry', 'contempt', 'disgusted', 'fearful', 'happy', 'neutral', 'sad', 'surprised'];
const HS7 = ['angry', 'disgusted', 'fearful', 'happy', 'neutral', 'sad', 'surprised'];
let emoSession = null;
const cropC = document.createElement('canvas'); cropC.width = cropC.height = 224;
const cctx = cropC.getContext('2d', { willReadFrequently: true });

async function hsPredict(src, box) {
  const sw = src.videoWidth || src.width, sh = src.videoHeight || src.height;
  const x = Math.max(0, box.x), y = Math.max(0, box.y);
  const w = Math.min(sw - x, box.width), h = Math.min(sh - y, box.height);
  if (w < 8 || h < 8) return null;
  cctx.drawImage(src, x, y, w, h, 0, 0, 224, 224);
  const d = cctx.getImageData(0, 0, 224, 224).data, N = 224 * 224, t = new Float32Array(3 * N);
  for (let i = 0; i < N; i++) {
    t[i]         = (d[i * 4]     / 255 - 0.485) / 0.229;
    t[i + N]     = (d[i * 4 + 1] / 255 - 0.456) / 0.224;
    t[i + 2 * N] = (d[i * 4 + 2] / 255 - 0.406) / 0.225;
  }
  const out = await emoSession.run({ [emoSession.inputNames[0]]: new ort.Tensor('float32', t, [1, 3, 224, 224]) });
  const logits = Array.from(out[emoSession.outputNames[0]].data);
  const labels = logits.length === 8 ? HS8 : HS7;
  const m = Math.max(...logits), ex = logits.map(v => Math.exp(v - m)), sum = ex.reduce((a, v) => a + v, 0);
  const res = {}; for (const k of KEYS) res[k] = 0;
  labels.forEach((k, i) => res[k] = ex[i] / sum);
  return res;
}

async function detect(src) {
  const opts = new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 });
  if (!emoSession)  // 增强模型不可用时退回内置的小模型
    return faceapi.detectAllFaces(src, opts).withFaceLandmarks().withFaceExpressions();
  const dets = await faceapi.detectAllFaces(src, opts);
  const faces = [];
  for (const det of dets) {
    const expressions = await hsPredict(src, det.box);
    if (expressions) faces.push({ detection: det, expressions });
  }
  return faces;
}
// 照片：原图 + 镜像图各识别一次取平均
async function detectTTA(c) {
  const a = await detect(c);
  const b = await detect(drawFlipped(c, c.width, c.height));
  for (const f of a) {
    const bx = f.detection.box, target = c.width - (bx.x + bx.width / 2);
    const g = b.find(g => Math.abs(g.detection.box.x + g.detection.box.width / 2 - target) < bx.width / 2);
    if (g) for (const k of KEYS) f.expressions[k] = (f.expressions[k] + g.expressions[k]) / 2;
  }
  return a;
}
const biggest = faces => faces.reduce((a, f) =>
  !a || f.detection.box.area > a.detection.box.area ? f : a, null);

function loop(ts) {
  if (!running) return;
  ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();
  drawFaces(lastFaces, lastFlip ? 0 : canvas.width);
  if (!busy && ts - lastTick > 100) {
    busy = true; lastTick = ts;
    // 奇偶帧交替用原图/镜像图识别，经平滑后相当于两者取平均
    const flip = (++frameNo % 2) === 1;
    const src = flip ? drawFlipped(video, canvas.width, canvas.height) : video;
    detect(src).then(faces => {
      lastFaces = faces; lastFlip = flip;
      const main = biggest(faces);
      if (!main) { smooth = null; shownTop = null; showResult(null); setStatus('未检测到人脸'); return; }
      const e = main.expressions;
      smooth = smooth || {};
      for (const k of KEYS) smooth[k] = smooth[k] == null ? e[k] : smooth[k] * 0.7 + e[k] * 0.3;
      if (calib) {
        for (const k of KEYS) calib.sum[k] = (calib.sum[k] || 0) + e[k];
        calib.n++;
        if (ts > calib.until) {
          baseline = {}; for (const k of KEYS) baseline[k] = calib.sum[k] / calib.n;
          calib = null; shownTop = null; $('calBtn').textContent = '重新校准';
        } else { setStatus('校准中：请保持面无表情、正对镜头…'); return; }
      }
      const adj = adjust(smooth), t = topOf(adj);
      // 防抖：新情绪要连续出现几次、或明显领先，才切换显示
      if (!shownTop || t === shownTop) { shownTop = t; candN = 0; }
      else {
        candN = t === candTop ? candN + 1 : 1; candTop = t;
        if (candN >= 3 || adj[t] - adj[shownTop] > 0.25) { shownTop = t; candN = 0; }
      }
      showResult(adj, shownTop);
      if (!loop.lastHist || ts - loop.lastHist > 1000) { pushHistory(shownTop); loop.lastHist = ts; }
      setStatus(`检测到 ${faces.length} 张人脸，实时识别中` + (baseline ? '（已校准）' : '（点「个人校准」可更准）'));
    }).catch(err => setStatus('识别出错：' + err.message)).finally(() => busy = false);
  }
  requestAnimationFrame(loop);
}

function stopCam() {
  running = false; lastFaces = []; calib = null; $('calBtn').disabled = true;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('camBtn').textContent = '开启摄像头';
}

$('camBtn').onclick = async () => {
  if (running) { stopCam(); setStatus('摄像头已关闭'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
    video.srcObject = stream; await video.play();
    canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
    $('hint').style.display = 'none'; $('camBtn').textContent = '关闭摄像头';
    running = true; smooth = null; shownTop = null; $('calBtn').disabled = false; requestAnimationFrame(loop);
  } catch (err) {
    setStatus('无法打开摄像头（' + (err.name === 'NotAllowedError' ? '权限被拒绝' : err.message) + '），可以改用上传照片');
  }
};

$('calBtn').onclick = () => {
  if (!running) return;
  calib = { until: performance.now() + 3000, sum: {}, n: 0 };
};

$('file').onchange = async ev => {
  const file = ev.target.files[0]; if (!file) return;
  stopCam();
  const img = new Image();
  img.onload = async () => {
    const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
    canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    $('hint').style.display = 'none'; setStatus('正在识别照片…');
    const faces = await detectTTA(canvas);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    drawFaces(faces, 0);
    const main = biggest(faces);
    const top = showResult(main && adjust(main.expressions));
    if (top) pushHistory(top);
    setStatus(faces.length ? `照片中检测到 ${faces.length} 张人脸` : '照片中没有检测到人脸，换一张正脸清晰的试试');
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
  ev.target.value = '';
};

(async () => {
  try {
    await Promise.all([
      faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
    ]);
    // 预热：先空跑一次三个网络，避免第一次识别卡顿
    setStatus('模型已下载，正在预热…');
    const warm = document.createElement('canvas'); warm.width = warm.height = 160;
    await detect(warm);
    await faceapi.nets.faceLandmark68Net.detectLandmarks(warm);
    await faceapi.nets.faceExpressionNet.predictExpressions(warm);
    let note = '';
    try {
      setStatus('正在下载增强表情模型（约 16MB，首次较慢）…');
      ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/';
      // 先试 GitHub（快），6 秒内连不上就用本站自带的模型文件（国内可用但较慢）
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 6000);
      let resp = await fetch(HS_URL, { signal: ac.signal }).catch(() => null);
      clearTimeout(timer);
      if (!resp || !resp.ok) resp = await fetch('models/enet_b0_8_best_vgaf.onnx');
      const buf = await resp.arrayBuffer();
      const sess = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'] });
      emoSession = sess;
      await hsPredict(warm, { x: 0, y: 0, width: 160, height: 160 });
    } catch (err) {
      emoSession = null; note = '（增强模型加载失败，已退回基础模型）';
      console.warn('HSEmotion load failed', err);
    }
    window.__modelsReady = true;
    $('camBtn').disabled = false;
    setStatus('模型已就绪，可以开始了' + note);
  } catch (err) {
    setStatus('模型加载失败，请检查网络后刷新：' + err.message);
  }
})();
</script>
</body>
</html>
